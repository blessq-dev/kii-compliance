# Настройки Streamlit для прототипа.
[server]
headless = true          # не спрашивать email при первом запуске; браузер открывает run.bat
address = "localhost"    # программа доступна только с этого компьютера
port = 8501

[browser]
gatherUsageStats = false # не отправлять статистику использования

[client]
toolbarMode = "minimal"  # скрыть служебные кнопки разработчика (Deploy и т. п.)

[theme]
base = "light"           # единый светлый вид независимо от темы системы
primaryColor = "#1f5fa8"   # единый акцентный цвет (кнопки, вкладки, прогресс)
textColor = "#14233a"      # основной текст — тёмно-синий, мягче чистого чёрного
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f3f5f9"  # поля ввода и подложки
borderColor = "#dde3ec"
baseRadius = "0.6rem"

[theme.sidebar]
backgroundColor = "#f5f7fb"
secondaryBackgroundColor = "#ffffff"
