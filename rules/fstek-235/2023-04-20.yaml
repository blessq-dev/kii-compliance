# База правил: требования к системе безопасности значимых объектов КИИ.
#
# Источник: docs/Prikaz_FSTEK_Rossii_ot_21_12_2017_N_235_red_ot_20_04_2023.docx —
#   приказ ФСТЭК России от 21.12.2017 № 235 в ред. от 20.04.2023 (изменения: приказы
#   ФСТЭК России от 27.03.2019 № 64, от 20.04.2023 № 69).
#   Текст — КонсультантПлюс, дата сохранения 21.10.2026.
#
# По сравнению с редакцией 2019 г. (приказ № 69): введено «ответственное лицо» —
# заместитель руководителя, на которого возложены полномочия по ИБ (Указ Президента РФ
# от 01.05.2022 № 250); повышение квалификации — не реже раза в 3 года (было 5 лет);
# сняты требования к объёму переподготовки (360 ч) и повышения квалификации (72 ч);
# добавлены требования С.18 (работники со СПО, п. 12.1) и Т.8 (меры при отсутствии
# технической поддержки СЗИ, п. 21, абз. 3).
# Выжимка с пояснениями: notes/fstek235_requirements.md
#
# Системы безопасности создаются субъектами КИИ (п. 2) в отношении всех их значимых
# объектов, в том числе в филиалах (п. 3). Требования проверяются как чек-лист для
# значимого объекта. condition — условие применимости: если условие
# не выполняется, требование можно отметить как «не применимо».

document:
  kind: security_system      # вид правил: чек-лист организационных требований
  # Дата, с которой применяется эта редакция пакета. Указана дата акта (редакции);
  # дату вступления в силу нужно уточнить по официальной публикации.
  effective_from: 2023-04-20
  title: "Требования к созданию систем безопасности значимых объектов КИИ РФ и обеспечению их функционирования"
  act: "Приказ ФСТЭК России от 21.12.2017 № 235"
  edition: "в ред. от 20.04.2023"
  file: "docs/Prikaz_FSTEK_Rossii_ot_21_12_2017_N_235_red_ot_20_04_2023.docx"

requirements:
  - id: С.1
    section: "II. Силы обеспечения безопасности"
    text: "Руководитель субъекта или его заместитель, на которого возложены полномочия по обеспечению ИБ по Указу Президента РФ № 250 (ответственное лицо), создал систему безопасности, организует и контролирует её функционирование"
    source: "Приказ ФСТЭК России № 235, п. 8 (в ред. приказа ФСТЭК России от 20.04.2023 № 69)"
  - id: С.2
    section: "II. Силы обеспечения безопасности"
    text: "Руководитель определил состав и структуру системы безопасности и функции её участников"
    source: "Приказ ФСТЭК России № 235, п. 9, абз. 1"
  - id: С.3
    section: "II. Силы обеспечения безопасности"
    text: "Система безопасности включает силы обеспечения безопасности обособленных подразделений (филиалов, представительств), в которых эксплуатируются значимые объекты"
    source: "Приказ ФСТЭК России № 235, п. 9, абз. 2"
    condition: "есть обособленные подразделения (филиалы, представительства), в которых эксплуатируются значимые объекты"
  - id: С.4
    section: "II. Силы обеспечения безопасности"
    text: "Создано (определено) структурное подразделение по безопасности или назначены специалисты по безопасности"
    source: "Приказ ФСТЭК России № 235, п. 10, абз. 1"
  - id: С.5
    section: "II. Силы обеспечения безопасности"
    text: "Руководитель подразделения по безопасности имеет высшее профессиональное образование в области ИБ (или иное высшее и документ о профессиональной переподготовке по направлению «Информационная безопасность») и стаж работы в сфере ИБ не менее 3 лет"
    source: "Приказ ФСТЭК России № 235, п. 12, абз. 2 (в ред. приказа ФСТЭК России от 20.04.2023 № 69)"
  - id: С.6
    section: "II. Силы обеспечения безопасности"
    text: "Штатные работники подразделения (специалисты) по безопасности имеют профессиональное образование в области ИБ (или иное высшее профессиональное образование и обучение по программе повышения квалификации по направлению «Информационная безопасность»)"
    source: "Приказ ФСТЭК России № 235, п. 12, абз. 3 (в ред. приказа ФСТЭК России от 20.04.2023 № 69)"
  - id: С.7
    section: "II. Силы обеспечения безопасности"
    text: "Работники подразделения (специалисты) по безопасности проходят обучение по программам повышения квалификации по ИБ не реже одного раза в 3 года"
    source: "Приказ ФСТЭК России № 235, п. 12, абз. 4 (в ред. приказа ФСТЭК России от 20.04.2023 № 69)"
  - id: С.8
    section: "II. Силы обеспечения безопасности"
    text: "На подразделение (специалистов) по безопасности не возложены функции, не связанные с обеспечением безопасности значимых объектов или ИБ субъекта; обязанности определены в должностных регламентах (инструкциях)"
    source: "Приказ ФСТЭК России № 235, п. 13"
  - id: С.9
    section: "II. Силы обеспечения безопасности"
    text: "Положения организационно-распорядительных документов по безопасности доведены до работников в части, их касающейся"
    source: "Приказ ФСТЭК России № 235, п. 15, абз. 2"
  - id: С.10
    section: "II. Силы обеспечения безопасности"
    text: "Не реже одного раза в год проводятся организационные мероприятия по повышению уровня знаний работников по вопросам безопасности КИИ и угрозам"
    source: "Приказ ФСТЭК России № 235, п. 15, абз. 3"
  - id: С.11
    section: "II. Силы обеспечения безопасности"
    text: "Представители привлекаемых организаций ознакомлены с организационно-распорядительными документами по безопасности"
    source: "Приказ ФСТЭК России № 235, п. 16"
    condition: "для эксплуатации, обеспечения функционирования или безопасности значимых объектов привлекаются сторонние организации"
  - id: С.12
    section: "II. Силы обеспечения безопасности"
    text: "Подразделение (специалисты) по безопасности осуществляет функции: предложения по совершенствованию ОРД, анализ угроз и выявление уязвимостей, реализация требований по безопасности, организационных мер и эксплуатация СЗИ, реагирование на компьютерные инциденты, организация оценки соответствия, предложения по совершенствованию системы безопасности"
    source: "Приказ ФСТЭК России № 235, п. 10, абз. 2 и перечень функций"
  - id: С.13
    section: "II. Силы обеспечения безопасности"
    text: "Подразделение (специалисты) по безопасности выполняет функции во взаимодействии с подразделениями, эксплуатирующими значимые объекты и обеспечивающими их функционирование"
    source: "Приказ ФСТЭК России № 235, п. 10, последний абзац"
  - id: С.14
    section: "II. Силы обеспечения безопасности"
    text: "Координацию и контроль функций подразделений (специалистов) по безопасности филиалов осуществляют ответственное лицо и (или) подразделение (специалисты) по безопасности субъекта; порядок их взаимодействия определён в ОРД"
    source: "Приказ ФСТЭК России № 235, п. 10.1, абз. 2–3 (в ред. приказа ФСТЭК России от 20.04.2023 № 69)"
    condition: "по решению руководителя в обособленных подразделениях (филиалах, представительствах) созданы подразделения по безопасности или назначены специалисты по безопасности"
  - id: С.15
    section: "II. Силы обеспечения безопасности"
    text: "Подразделение (специалисты) по безопасности основного общества (некоммерческой организации) координирует подразделения (специалистов) по безопасности дочерних обществ (организаций, в которых участвует некоммерческая организация)"
    source: "Приказ ФСТЭК России № 235, п. 10.2"
    condition: "субъект — хозяйственное общество, имеющее дочерние общества — субъекты КИИ, или некоммерческая организация, определяющая решения участвуемых организаций — субъектов КИИ"
  - id: С.16
    section: "II. Силы обеспечения безопасности"
    text: "Подразделения, эксплуатирующие значимые объекты, обеспечивают безопасность эксплуатируемых ими объектов; объём их задач определён в ОРД"
    source: "Приказ ФСТЭК России № 235, п. 14, абз. 1"
  - id: С.17
    section: "II. Силы обеспечения безопасности"
    text: "Обязанности работников эксплуатирующих подразделений, на которых возложены отдельные функции по безопасности, определены в должностных регламентах (инструкциях); их деятельность координирует и контролирует подразделение (специалисты) по безопасности"
    source: "Приказ ФСТЭК России № 235, п. 14, абз. 2–3"
    condition: "в подразделениях, эксплуатирующих значимые объекты, назначены работники с отдельными функциями по обеспечению безопасности"
  - id: С.18
    section: "II. Силы обеспечения безопасности"
    text: "На работников со средним профессиональным образованием по специальности в области ИБ возложены отдельные функции по обеспечению безопасности значимых объектов в соответствии с их специальностью"
    source: "Приказ ФСТЭК России № 235, п. 12.1 (введён приказом ФСТЭК России от 20.04.2023 № 69)"
    condition: "в штатном расписании субъекта есть должности работников со средним профессиональным образованием в области ИБ"
  - id: Т.1
    section: "III. Программные и программно-аппаратные средства"
    text: "Применяются сертифицированные средства защиты информации или прошедшие оценку соответствия в форме испытаний или приёмки"
    source: "Приказ ФСТЭК России № 235, п. 18"
  - id: Т.2
    section: "III. Программные и программно-аппаратные средства"
    text: "Средства защиты информации применяются в соответствии с эксплуатационной документацией разработчиков (производителей)"
    source: "Приказ ФСТЭК России № 235, п. 20"
  - id: Т.3
    section: "III. Программные и программно-аппаратные средства"
    text: "Средства защиты информации обеспечены технической поддержкой разработчиков (производителей)"
    source: "Приказ ФСТЭК России № 235, п. 21, абз. 1 (в ред. приказа ФСТЭК России от 20.04.2023 № 69)"
  - id: Т.4
    section: "III. Программные и программно-аппаратные средства"
    text: "Порядок применения средств защиты информации определён в организационно-распорядительных документах"
    source: "Приказ ФСТЭК России № 235, п. 22"
  - id: Т.5
    section: "III. Программные и программно-аппаратные средства"
    text: "Параметры и характеристики применяемых средств защиты информации обеспечивают реализацию технических мер по обеспечению безопасности значимых объектов"
    source: "Приказ ФСТЭК России № 235, п. 19, абз. 1"
  - id: Т.6
    section: "III. Программные и программно-аппаратные средства"
    text: "В приоритетном порядке применяются средства защиты информации, встроенные в программное обеспечение и (или) программно-аппаратные средства значимых объектов"
    source: "Приказ ФСТЭК России № 235, п. 19, абз. 2"
    condition: "в программном обеспечении или программно-аппаратных средствах значимых объектов есть встроенные средства защиты информации"
  - id: Т.7
    section: "III. Программные и программно-аппаратные средства"
    text: "При выборе средств защиты информации учтено возможное наличие ограничений со стороны разработчиков (производителей) или иных лиц на их применение на значимых объектах субъекта"
    source: "Приказ ФСТЭК России № 235, п. 21, абз. 2"
  - id: Т.8
    section: "III. Программные и программно-аппаратные средства"
    text: "При невозможности технической поддержки средств защиты информации разработчиками (производителями) реализованы организационные и технические меры, блокирующие угрозы безопасности информации с необходимым уровнем защищённости значимого объекта (по приказу ФСТЭК России № 239)"
    source: "Приказ ФСТЭК России № 235, п. 21, абз. 3 (введён приказом ФСТЭК России от 20.04.2023 № 69)"
    condition: "техническая поддержка применяемых средств защиты информации со стороны разработчиков (производителей) невозможна"
  - id: Д.1
    section: "IV. Организационно-распорядительные документы (ОРД)"
    text: "Утверждены ОРД по безопасности значимых объектов, определяющие порядок и правила функционирования системы безопасности и обеспечения безопасности значимых объектов"
    source: "Приказ ФСТЭК России № 235, п. 23, абз. 1"
  - id: Д.2
    section: "IV. Организационно-распорядительные документы (ОРД)"
    text: "ОРД определяют цели и задачи, основные угрозы и категории нарушителей, основные мероприятия, состав и структуру системы безопасности и функции участников, порядок применения и формы оценки соответствия"
    source: "Приказ ФСТЭК России № 235, п. 25 «а»"
  - id: Д.3
    section: "IV. Организационно-распорядительные документы (ОРД)"
    text: "ОРД определяют планы мероприятий, модели угроз, порядок реализации мер, испытаний (приёмки) СЗИ, реагирования на компьютерные инциденты, информирования и обучения, взаимодействия подразделений и взаимодействия с ГосСОПКА"
    source: "Приказ ФСТЭК России № 235, п. 25 «б»"
  - id: Д.4
    section: "IV. Организационно-распорядительные документы (ОРД)"
    text: "ОРД определяют правила безопасной работы работников и их действия при компьютерных инцидентах и иных нештатных ситуациях"
    source: "Приказ ФСТЭК России № 235, п. 25 «в»"
  - id: Д.5
    section: "IV. Организационно-распорядительные документы (ОРД)"
    text: "ОРД утверждены руководителем субъекта (ответственным лицом); отдельные ОРД — по решению руководителя иными уполномоченными лицами"
    source: "Приказ ФСТЭК России № 235, п. 26 (в ред. приказа ФСТЭК России от 20.04.2023 № 69)"
  - id: Д.6
    section: "IV. Организационно-распорядительные документы (ОРД)"
    text: "ОРД доведены до руководства, ответственного лица, подразделения (специалистов) по безопасности и иных участников в части, их касающейся"
    source: "Приказ ФСТЭК России № 235, п. 27 (в ред. приказа ФСТЭК России от 20.04.2023 № 69)"
  - id: Д.7
    section: "IV. Организационно-распорядительные документы (ОРД)"
    text: "ОРД дочернего общества (организации с участием некоммерческой организации) разработаны с учётом ОРД основного общества (организации) и не противоречат им"
    source: "Приказ ФСТЭК России № 235, п. 23, абз. 2–3"
    condition: "субъект является дочерним обществом (организацией с участием некоммерческой организации), являющимся субъектом КИИ"
  - id: Ф.1
    section: "V. Функционирование системы безопасности"
    text: "Внедрены процессы планирования, реализации, контроля состояния и совершенствования безопасности значимых объектов"
    source: "Приказ ФСТЭК России № 235, п. 28"
  - id: Ф.2
    section: "V. Функционирование системы безопасности"
    text: "Разработан и утверждён ежегодный (или на более длительный срок) план мероприятий по обеспечению безопасности значимых объектов"
    source: "Приказ ФСТЭК России № 235, п. 29"
  - id: Ф.3
    section: "V. Функционирование системы безопасности"
    text: "План мероприятий содержит наименования мероприятий, сроки выполнения и ответственных"
    source: "Приказ ФСТЭК России № 235, п. 30, абз. 1"
  - id: Ф.4
    section: "V. Функционирование системы безопасности"
    text: "План мероприятий утверждён руководителем и доведён до подразделений (работников) в части, их касающейся"
    source: "Приказ ФСТЭК России № 235, п. 31, абз. 2"
  - id: Ф.5
    section: "V. Функционирование системы безопасности"
    text: "Ежегодно готовится отчёт о выполнении плана мероприятий и представляется руководителю"
    source: "Приказ ФСТЭК России № 235, п. 32, абз. 2"
  - id: Ф.6
    section: "V. Функционирование системы безопасности"
    text: "Результаты реализации мероприятий документируются в порядке, установленном ОРД"
    source: "Приказ ФСТЭК России № 235, п. 34, абз. 3"
  - id: Ф.7
    section: "V. Функционирование системы безопасности"
    text: "Внутренний контроль состояния безопасности проводится комиссией не реже одного раза в 3 года (либо проводится внешняя оценка организацией-лицензиатом)"
    source: "Приказ ФСТЭК России № 235, п. 35; п. 36, абз. 1–2, 5–6"
  - id: Ф.8
    section: "V. Функционирование системы безопасности"
    text: "Результаты контроля оформлены актом, подписанным членами комиссии и утверждённым руководителем (ответственным лицом)"
    source: "Приказ ФСТЭК России № 235, п. 36, абз. 4 (в ред. приказа ФСТЭК России от 20.04.2023 № 69)"
  - id: Ф.9
    section: "V. Функционирование системы безопасности"
    text: "Замечания по результатам контроля (внешней оценки) устраняются в порядке и сроки, установленные руководителем (ответственным лицом)"
    source: "Приказ ФСТЭК России № 235, п. 36, абз. 7 (в ред. приказа ФСТЭК России от 20.04.2023 № 69)"
  - id: Ф.10
    section: "V. Функционирование системы безопасности"
    text: "Проводится анализ функционирования системы безопасности; предложения по совершенствованию представляются руководителю (ответственному лицу) и по его решению включаются в план мероприятий"
    source: "Приказ ФСТЭК России № 235, п. 37 (в ред. приказа ФСТЭК России от 20.04.2023 № 69)"
  - id: Ф.11
    section: "V. Функционирование системы безопасности"
    text: "План мероприятий разработан подразделением (специалистами) по безопасности с участием подразделений, эксплуатирующих значимые объекты и обеспечивающих их функционирование"
    source: "Приказ ФСТЭК России № 235, п. 29, абз. 3"
  - id: Ф.12
    section: "V. Функционирование системы безопасности"
    text: "В план мероприятий включены мероприятия по обеспечению безопасности значимых объектов, функционирующих в обособленных подразделениях (филиалах, представительствах)"
    source: "Приказ ФСТЭК России № 235, п. 29, абз. 4"
    condition: "есть обособленные подразделения (филиалы, представительства), в которых эксплуатируются значимые объекты"
  - id: Ф.13
    section: "V. Функционирование системы безопасности"
    text: "В план мероприятий включены мероприятия по обеспечению функционирования системы безопасности, а также организационные и технические мероприятия, направленные на решение задач п. 6 Требований"
    source: "Приказ ФСТЭК России № 235, п. 30, абз. 2"
  - id: Ф.14
    section: "V. Функционирование системы безопасности"
    text: "Контроль за выполнением плана мероприятий осуществляет подразделение (специалисты) по безопасности"
    source: "Приказ ФСТЭК России № 235, п. 32, абз. 1"
  - id: Ф.15
    section: "V. Функционирование системы безопасности"
    text: "В состав комиссии по внутреннему контролю включены работники подразделения (специалисты) по безопасности, подразделений, эксплуатирующих значимые объекты, и подразделений, обеспечивающих их функционирование"
    source: "Приказ ФСТЭК России № 235, п. 36, абз. 1"
