# База правил: сферы деятельности субъектов КИИ.
#
# Источник: docs/archive/FZ-187.pdf — Федеральный закон от 26.07.2017 № 187-ФЗ
#   «О безопасности критической информационной инфраструктуры Российской Федерации»,
#   ст. 2, п. 8 (понятие «субъекты критической информационной инфраструктуры»).
#
# Субъект КИИ — владелец ИС, ИТКС или АСУ, функционирующих в одной из перечисленных
# сфер, либо лицо, обеспечивающее взаимодействие таких систем или сетей.
# Категорирование (ПП РФ № 127, Правила, п. 2) проводят субъекты КИИ, поэтому
# объект вне перечисленных сфер движок считает не подлежащим категорированию.

document:
  kind: spheres              # вид правил (типовая конструкция): перечень сфер субъектов КИИ
  title: "О безопасности критической информационной инфраструктуры Российской Федерации"
  act: "Федеральный закон от 26.07.2017 № 187-ФЗ"
  edition: "исходная редакция"
  # Дата, с которой применяется эта редакция пакета. Указана дата акта (редакции);
  # дату вступления в силу нужно уточнить по официальной публикации.
  effective_from: 2017-07-26
  file: "docs/archive/FZ-187.pdf"

spheres:
  - {id: healthcare,  title: "Здравоохранение",                              source: "187-ФЗ, ст. 2, п. 8"}
  - {id: science,     title: "Наука",                                        source: "187-ФЗ, ст. 2, п. 8"}
  - {id: transport,   title: "Транспорт",                                    source: "187-ФЗ, ст. 2, п. 8"}
  - {id: telecom,     title: "Связь",                                        source: "187-ФЗ, ст. 2, п. 8"}
  - {id: energy,      title: "Энергетика",                                   source: "187-ФЗ, ст. 2, п. 8"}
  - {id: finance,     title: "Банковская сфера и иные сферы финансового рынка", source: "187-ФЗ, ст. 2, п. 8"}
  - {id: fuel_energy, title: "Топливно-энергетический комплекс",             source: "187-ФЗ, ст. 2, п. 8"}
  - {id: nuclear,     title: "Область атомной энергии",                      source: "187-ФЗ, ст. 2, п. 8"}
  - {id: defense,     title: "Оборонная промышленность",                     source: "187-ФЗ, ст. 2, п. 8"}
  - {id: space,       title: "Ракетно-космическая промышленность",           source: "187-ФЗ, ст. 2, п. 8"}
  - {id: mining,      title: "Горнодобывающая промышленность",               source: "187-ФЗ, ст. 2, п. 8"}
  - {id: metallurgy,  title: "Металлургическая промышленность",              source: "187-ФЗ, ст. 2, п. 8"}
  - {id: chemical,    title: "Химическая промышленность",                    source: "187-ФЗ, ст. 2, п. 8"}
  - {id: interaction, title: "Обеспечение взаимодействия систем или сетей субъектов КИИ", source: "187-ФЗ, ст. 2, п. 8 (окончание)"}

# Вариант для объектов вне перечня — категорированию не подлежат.
other:
  id: other
  title: "Иная сфера (не указана в ст. 2, п. 8 187-ФЗ)"
  source: "187-ФЗ, ст. 2, п. 8; ПП РФ № 127, Правила, п. 2"
