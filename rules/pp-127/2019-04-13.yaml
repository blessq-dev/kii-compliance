# База правил: категорирование объектов КИИ.
#
# Источник: docs/PP-127_red_2019-04-13.docx — постановление Правительства РФ от 08.02.2018 № 127
#   в ред. от 13.04.2019 (ПП РФ № 452: Перечень показателей изложен в новой редакции).
#   Текст — КонсультантПлюс, дата сохранения 22.10.2026.
#
# Пакет составлен полуавтоматически: черновик сгенерирован по таблице Перечня из текста
# (engine/source_table.py, draft_package; основа — пакеты 2018-02-08 и 2025-11-07), затем
# проверен экспертом: краткое название и единицы п. 4, единица п. 8, формулировки условий
# state_org и defense_order по тексту этой редакции, общее правило п. 6, абз. 3.
# Значения показателей — дословно из текста; их совпадение с текстом проверяется тестом
# (tests/test_source_table.py). Формат правил — как в rules/pp-127/2018-02-08.yaml.
#
# Отличия от исходной редакции: пп. 2б, 3б, 11б — III категория от 2 тыс. человек (было 50);
# п. 4 — один показатель (абоненты, от 3 тыс.) вместо территории и числа людей; п. 5 — I категория
# «менее или равно 6» ч; п. 8 — новые пороги 1/10/20 %; п. 9 — один показатель вместо 9а–9в;
# пп. 13а, 13б — III категория от 0 %; п. 14 — I категория «менее или равно 1» ч.

document:
  kind: categorization
  effective_from: 2019-04-13
  title: Правила категорирования объектов КИИ РФ и перечень показателей критериев значимости
  act: Постановление Правительства РФ от 08.02.2018 № 127
  edition: в ред. от 13.04.2019
  file: docs/PP-127_red_2019-04-13.docx
logic:
- id: highest_category
  text: Объекту присваивается категория значимости с наивысшим значением по перечню показателей.
  source: ПП РФ № 127, Правила категорирования, п. 6, абз. 1
- id: subitems
  text: Для показателя с несколькими значениями (территория, количество людей) оценка производится по каждому значению, категория — по наивысшему.
  source: ПП РФ № 127, Правила категорирования, п. 6, абз. 2
- id: first_category_stop
  text: Если по одному из показателей объект отнесён к первой категории, расчёт по остальным показателям не проводится.
  source: ПП РФ № 127, Правила категорирования, п. 6, абз. 3 (введён ПП РФ от 13.04.2019 № 452)
- id: no_category
  text: Если ни один показатель не применим или объект не соответствует ни одному значению — категория не присваивается.
  source: ПП РФ № 127, Правила категорирования, п. 6, абз. 4
- id: order
  text: 'Устанавливаются 3 категории значимости: самая высокая — первая, самая низкая — третья.'
  source: ПП РФ № 127, Правила категорирования, п. 7
conditions:
- id: state_org
  text: Субъект КИИ является государственной корпорацией, государственным унитарным предприятием, государственной компанией, стратегическим акционерным обществом, стратегическим предприятием
  short: Субъект — госкорпорация, ГУП, госкомпания, стратегическое АО или предприятие
  source: ПП РФ № 127, Перечень показателей, п. 8
- id: financial_org
  text: Субъект КИИ является в соответствии с законодательством РФ системно значимой кредитной организацией, оператором услуг платёжной инфраструктуры системно и (или) социально значимых платёжных систем
    или системно значимой инфраструктурной организацией финансового рынка
  short: Субъект — системно значимая кредитная организация, оператор услуг платёжной инфраструктуры значимых платёжных систем или системно значимая инфраструктурная организация финансового рынка
  source: ПП РФ № 127, Перечень показателей, п. 10
- id: defense_order
  text: Субъект КИИ выполняет (обеспечивает) государственный оборонный заказ
  short: Субъект выполняет (обеспечивает) государственный оборонный заказ
  source: ПП РФ № 127, Перечень показателей, п. 13
- id: defense_is
  text: Объект является информационной системой в области обеспечения обороны страны, безопасности государства и правопорядка
  short: Объект — информационная система в области обороны, безопасности государства и правопорядка
  source: ПП РФ № 127, Перечень показателей, п. 14
