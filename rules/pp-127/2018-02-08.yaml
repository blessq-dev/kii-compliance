# База правил: категорирование объектов КИИ.
#
# Источник: docs/archive/PP-127.pdf — постановление Правительства РФ от 08.02.2018 № 127
#   (исходная редакция): Правила категорирования и Перечень показателей
#   критериев значимости объектов КИИ РФ и их значений.
# Выжимка с пояснениями: notes/pp127_categorization.md
#
# Как читать правило показателя:
#   type: number  — числовой показатель. Для каждой категории задан диапазон:
#                   min / max — границы (если границы нет, поле отсутствует),
#                   min_incl / max_incl — включается ли граница
#                   («более или равно» / «менее или равно» → true; «более» / «менее» → false).
#                   text — дословная формулировка значения из Перечня.
#   type: choice  — показатель с перечислимыми значениями (территория, уровень органа и т. п.).
#                   options — варианты ответа; category: null — значение не соответствует
#                   ни одной категории (п. 6 Правил, абз. 3).
#   warning       — замечание к тексту документа (см. раздел 3 выжимки). Если показатель
#                   заполнен, движок выводит это замечание в отчёт.
#   short         — краткое название показателя для интерфейса (подпись, не из НПА);
#                   полная формулировка из Перечня — в поле title.
#   applies_if    — условие применимости показателя (id из раздела conditions). Если условие
#                   не выполняется, показатель к объекту неприменим и заполнять его нельзя.
#   input         — ограничения ввода для защиты от ошибок пользователя. Это ИНЖЕНЕРНЫЕ
#                   ограничения (не из НПА): min/max — ошибка (значение невозможно),
#                   integer — только целое, warn_above — предупреждение (вероятная ошибка единиц).

document:
  kind: categorization       # вид правил: показатели значимости с диапазонами по категориям
  # Дата, с которой применяется эта редакция пакета. Указана дата акта (редакции);
  # дату вступления в силу нужно уточнить по официальной публикации.
  effective_from: 2018-02-08
  title: "Правила категорирования объектов КИИ РФ и перечень показателей критериев значимости"
  act: "Постановление Правительства РФ от 08.02.2018 № 127"
  edition: "исходная редакция"
  file: "docs/archive/PP-127.pdf"

# Общие правила присвоения категории (Правила категорирования).
logic:
  - id: highest_category
    text: "Объекту присваивается категория значимости с наивысшим значением по перечню показателей."
    source: "ПП РФ № 127, Правила категорирования, п. 6, абз. 1"
  - id: subitems
    text: "Для показателя с несколькими значениями (территория, количество людей) оценка производится по каждому значению, категория — по наивысшему."
    source: "ПП РФ № 127, Правила категорирования, п. 6, абз. 2"
  - id: no_category
    text: "Если ни один показатель не применим или объект не соответствует ни одному значению — категория не присваивается."
    source: "ПП РФ № 127, Правила категорирования, п. 6, абз. 3"
  - id: order
    text: "Устанавливаются 3 категории значимости: самая высокая — первая, самая низкая — третья."
    source: "ПП РФ № 127, Правила категорирования, п. 7"

# Условия применимости показателей. Часть показателей Перечня относится только к субъектам
# (объектам) определённого вида — это указано в формулировке самого показателя. Если условие
# не выполняется, показатель к объекту неприменим (Правила, п. 6, абз. 3).
# Условие подтверждает пользователь (признак объекта), движок проверяет, что показатель
# не заполнен без подтверждённого условия.
conditions:
  - id: state_org
    text: "Субъект КИИ является государственной корпорацией, государственным унитарным предприятием, муниципальным унитарным предприятием, государственной компанией, организацией с участием государства и (или) стратегическим акционерным обществом, стратегическим предприятием"
    short: "Субъект — госкорпорация, ГУП, МУП, госкомпания, организация с участием государства, стратегическое АО или предприятие"
    source: "ПП РФ № 127, Перечень показателей, п. 8"
  - id: financial_org
    text: "Субъект КИИ является в соответствии с законодательством РФ системно значимой кредитной организацией, оператором услуг платёжной инфраструктуры системно и (или) социально значимых платёжных систем или системно значимой инфраструктурной организацией финансового рынка"
    short: "Субъект — системно значимая кредитная организация, оператор услуг платёжной инфраструктуры значимых платёжных систем или системно значимая инфраструктурная организация финансового рынка"
    source: "ПП РФ № 127, Перечень показателей, п. 10"
  - id: defense_order
    text: "Субъект КИИ выполняет государственный оборонный заказ"
    short: "Субъект выполняет государственный оборонный заказ"
    source: "ПП РФ № 127, Перечень показателей, п. 13"
  - id: defense_is
    text: "Объект является информационной системой в области обеспечения обороны страны, безопасности государства и правопорядка"
    short: "Объект — информационная система в области обороны, безопасности государства и правопорядка"
    source: "ПП РФ № 127, Перечень показателей, п. 14"

# Варианты для территориальных показателей (2а, 3а, 4а, 11а) одинаковы во всех пунктах Перечня.
territory_options: &territory
  - id: none
    text: "Не соответствует ни одному значению (меньше территории одного муниципального образования)"
    category: null
  - id: mo
    text: "Вся территория одного муниципального образования или одной внутригородской территории города федерального значения"
    category: 3
  - id: subject
    text: "Выход за пределы территории одного муниципального образования или одной внутригородской территории города федерального значения, но не за пределы территории одного субъекта РФ или территории города федерального значения"
    category: 2
  - id: federal
    text: "Выход за пределы территории одного субъекта РФ или территории города федерального значения"
    category: 1

# Диапазоны для показателей «количество людей, тыс. человек» (2б, 3б, 4б, 11б).
people_thousands_values: &people
  3: {min: 50, min_incl: true, max: 1000, max_incl: false, text: "более или равно 50, но менее 1000"}
  2: {min: 1000, min_incl: true, max: 5000, max_incl: false, text: "более или равно 1000, но менее 5000"}
  1: {min: 5000, min_incl: true, text: "более или равно 5000"}

indicators:

  # ---------------- I. Социальная значимость ----------------
  - id: "1"
    short: "Ущерб жизни и здоровью людей"  # краткое название для интерфейса (не из НПА)
    section: "I. Социальная значимость"
    title: "Причинение ущерба жизни и здоровью людей"
    type: number
    unit: "человек"
    input:  # инженерное ограничение ввода, НЕ нормативное требование
      min: 0
      integer: true
    source: "ПП РФ № 127, Перечень показателей, п. 1"
    values:
      3: {min: 1, min_incl: true, max: 50, max_incl: true, text: "более или равно 1, но менее или равно 50"}
      2: {min: 50, min_incl: false, max: 500, max_incl: true, text: "более 50, но менее или равно 500"}
      1: {min: 500, min_incl: false, text: "более 500"}

  - id: "2а"
    short: "Жизнеобеспечение населения — территория"  # краткое название для интерфейса (не из НПА)
    section: "I. Социальная значимость"
    title: "Прекращение или нарушение функционирования объектов обеспечения жизнедеятельности населения — территория, на которой возможно нарушение обеспечения жизнедеятельности населения"
    type: choice
    source: "ПП РФ № 127, Перечень показателей, п. 2, подп. «а»"
    options: *territory

  - id: "2б"
    short: "Жизнеобеспечение населения — число людей"  # краткое название для интерфейса (не из НПА)
    section: "I. Социальная значимость"
    title: "Прекращение или нарушение функционирования объектов обеспечения жизнедеятельности населения — количество людей, условия жизнедеятельности которых могут быть нарушены"
    type: number
    unit: "тыс. человек"
    input:  # инженерное ограничение ввода, НЕ нормативное требование
      min: 0
      warn_above: 150000
      warn_text: "Значение больше 150 млн человек. Показатель вводится в ТЫСЯЧАХ человек — проверьте, не введено ли число в человеках."
    source: "ПП РФ № 127, Перечень показателей, п. 2, подп. «б»"
    values: *people

  - id: "3а"
    short: "Транспорт — территория"  # краткое название для интерфейса (не из НПА)
    section: "I. Социальная значимость"
    title: "Прекращение или нарушение функционирования объектов транспортной инфраструктуры — территория, на которой возможно нарушение транспортного сообщения или предоставления транспортных услуг"
    type: choice
    source: "ПП РФ № 127, Перечень показателей, п. 3, подп. «а»"
    options: *territory

  - id: "3б"
    short: "Транспорт — число людей без транспортных услуг"  # краткое название для интерфейса (не из НПА)
    section: "I. Социальная значимость"
    title: "Прекращение или нарушение функционирования объектов транспортной инфраструктуры — количество людей, для которых могут быть недоступны транспортные услуги"
    type: number
    unit: "тыс. человек"
    input:  # инженерное ограничение ввода, НЕ нормативное требование
      min: 0
      warn_above: 150000
      warn_text: "Значение больше 150 млн человек. Показатель вводится в ТЫСЯЧАХ человек — проверьте, не введено ли число в человеках."
    source: "ПП РФ № 127, Перечень показателей, п. 3, подп. «б»"
    values: *people

  - id: "4а"
    short: "Сеть связи — территория"  # краткое название для интерфейса (не из НПА)
    section: "I. Социальная значимость"
    title: "Прекращение или нарушение функционирования сети связи — территория, на которой возможно прекращение или нарушение функционирования сети связи"
    type: choice
    source: "ПП РФ № 127, Перечень показателей, п. 4, подп. «а»"
    options: *territory

  - id: "4б"
    short: "Сеть связи — число людей без услуг связи"  # краткое название для интерфейса (не из НПА)
    section: "I. Социальная значимость"
    title: "Прекращение или нарушение функционирования сети связи — количество людей, для которых могут быть недоступны услуги связи"
    type: number
    unit: "тыс. человек"
    input:  # инженерное ограничение ввода, НЕ нормативное требование
      min: 0
      warn_above: 150000
      warn_text: "Значение больше 150 млн человек. Показатель вводится в ТЫСЯЧАХ человек — проверьте, не введено ли число в человеках."
    source: "ПП РФ № 127, Перечень показателей, п. 4, подп. «б»"
    values: *people

  - id: "5"
    short: "Недоступность государственной услуги"  # краткое название для интерфейса (не из НПА)
    section: "I. Социальная значимость"
    title: "Отсутствие доступа к государственной услуге — максимальное допустимое время, в течение которого государственная услуга может быть недоступна для получателей"
    type: number
    unit: "часов"
    input:  # инженерное ограничение ввода, НЕ нормативное требование
      min: 0
      warn_above: 8760
      warn_text: "Значение больше 8760 часов (одного года) — проверьте, что время указано в часах."
    source: "ПП РФ № 127, Перечень показателей, п. 5"
    values:
      3: {min: 12, min_incl: false, max: 24, max_incl: true, text: "менее или равно 24, но более 12"}
      2: {min: 6, min_incl: false, max: 12, max_incl: true, text: "менее или равно 12, но более 6"}
      1: {max: 6, max_incl: false, text: "менее 6"}
    warning: "По тексту ПП № 127 значение ровно 6 часов не попадает ни в одну категорию (II — «более 6», I — «менее 6»)."

  # ---------------- II. Политическая значимость ----------------
  - id: "6"
    short: "Нарушение функционирования государственного органа"  # краткое название для интерфейса (не из НПА)
    section: "II. Политическая значимость"
    title: "Прекращение или нарушение функционирования государственного органа в части невыполнения возложенной на него функции (полномочия)"
    type: choice
    source: "ПП РФ № 127, Перечень показателей, п. 6"
    options:
      - id: none
        text: "Не соответствует ни одному значению"
        category: null
      - id: regional
        text: "Орган государственной власти субъекта РФ или города федерального значения"
        category: 3
      - id: federal
        text: "Федеральный орган государственной власти"
        category: 2
      - id: supreme
        text: "Администрация Президента РФ, Правительство РФ, Федеральное Собрание РФ, Совет Безопасности РФ, Верховный Суд РФ, Конституционный Суд РФ"
        category: 1

  - id: "7"
    short: "Нарушение международного договора РФ"  # краткое название для интерфейса (не из НПА)
    section: "II. Политическая значимость"
    title: "Нарушение условий международного договора РФ, срыв переговоров или подписания планируемого к заключению международного договора РФ — по уровню договора"
    type: choice
    source: "ПП РФ № 127, Перечень показателей, п. 7"
    options:
      - id: none
        text: "Не соответствует ни одному значению"
        category: null
      - id: interagency
        text: "Договор межведомственного характера (срыв переговоров или подписания)"
        category: 3
      - id: intergovernmental
        text: "Межправительственный договор (срыв переговоров или подписания)"
        category: 2
      - id: interstate
        text: "Межгосударственный договор (срыв переговоров или подписания)"
        category: 1

  # ---------------- III. Экономическая значимость ----------------
  - id: "8"
    short: "Снижение дохода субъекта КИИ"  # краткое название для интерфейса (не из НПА)
    section: "III. Экономическая значимость"
    title: "Ущерб субъекту КИИ (госкорпорации, ГУП, МУП, госкомпании, организации с участием государства, стратегическому АО или предприятию) — снижение уровня дохода по всем видам деятельности"
    applies_if: state_org
    type: number
    unit: "% прогнозируемого объёма годового дохода"
    input:  # инженерное ограничение ввода, НЕ нормативное требование
      min: 0
      max: 100
      max_text: "Показатель задан в процентах от величины (дохода, объёма продукции) и не может превышать 100 %."
    source: "ПП РФ № 127, Перечень показателей, п. 8"
    values:
      3: {min: 5, min_incl: false, max: 10, max_incl: true, text: "более 5, но менее или равно 10"}
      2: {min: 10, min_incl: false, max: 15, max_incl: true, text: "более 10, но менее или равно 15"}
      1: {min: 15, min_incl: false, text: "более 15"}

  - id: "9а"
