    values:
      3: {min: 0.001, min_incl: false, max: 0.05, max_incl: true, text: "более 0,001, но менее или равно 0,05"}
      2: {min: 0.05, min_incl: false, max: 0.1, max_incl: true, text: "более 0,05, но менее или равно 0,1"}
      1: {min: 0.1, min_incl: false, text: "более 0,1"}

  - id: "9в"
    short: "Ущерб бюджетам внебюджетных фондов"  # краткое название для интерфейса (не из НПА)
    section: "III. Экономическая значимость"
    title: "Ущерб бюджетам РФ — снижение доходов бюджетов государственных внебюджетных фондов"
    type: number
    unit: "% прогнозируемого годового дохода бюджета"
    input:  # инженерное ограничение ввода, НЕ нормативное требование
      min: 0
      max: 100
      max_text: "Показатель задан в процентах от величины (дохода, объёма продукции) и не может превышать 100 %."
    source: "ПП РФ № 127, Перечень показателей, п. 9, подп. «в»"
