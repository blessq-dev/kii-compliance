# База правил: категорирование объектов КИИ.
#
# Источник: docs/Postanovlenie_Pravitelstva_RF_ot_08_02_2018_N_127_red_ot.docx —
#   постановление Правительства РФ от 08.02.2018 № 127 в ред. от 07.11.2025
#   (изменения: ПП РФ от 13.04.2019 № 452, от 24.12.2021 № 2431, от 19.08.2022 № 1463,
#   от 20.12.2022 № 2360, от 19.09.2024 № 1281, от 07.11.2025 № 1762).
#   Текст — КонсультантПлюс, дата сохранения 21.10.2026.
# Выжимка с пояснениями: notes/pp127_categorization.md
#
# Формат правил — как в пакете исходной редакции (rules/pp-127/2018-02-08.yaml):
#   type: number / choice, values / options, applies_if, input, short, warning.
# В поле source после номера пункта указан акт, которым пункт изложен в действующей
# редакции (по пометкам «в ред.» в тексте документа), — это видно в анализе влияния.

document:
  kind: categorization       # вид правил: показатели значимости с диапазонами по категориям
  # Дата, с которой применяется эта редакция пакета. Указана дата акта (редакции);
  # дату вступления в силу нужно уточнить по официальной публикации.
  effective_from: 2025-11-07
  title: "Правила категорирования объектов КИИ РФ и перечень показателей критериев значимости"
  act: "Постановление Правительства РФ от 08.02.2018 № 127"
  edition: "в ред. от 07.11.2025"
  file: "docs/Postanovlenie_Pravitelstva_RF_ot_08_02_2018_N_127_red_ot.docx"

# Общие правила присвоения категории (Правила категорирования).
logic:
  - id: typical_objects
    text: "Категорированию подлежат объекты КИИ, соответствующие типам систем и сетей, включённым в перечни типовых отраслевых объектов КИИ. Перечни типовых объектов в базу правил прототипа не входят: соответствие объекта типовому подтверждает пользователь."
    source: "ПП РФ № 127, Правила категорирования, п. 3 (в ред. ПП РФ от 07.11.2025 № 1762)"
  - id: highest_category
    text: "Объекту присваивается категория значимости с наивысшим значением по перечню показателей."
    source: "ПП РФ № 127, Правила категорирования, п. 6, абз. 1"
  - id: subitems
    text: "Для показателя с несколькими значениями (территория, количество людей) оценка производится по каждому значению, категория — по наивысшему."
    source: "ПП РФ № 127, Правила категорирования, п. 6, абз. 2"
  - id: first_category_stop
    text: "Если по одному из показателей объект отнесён к первой категории, расчёт по остальным показателям не проводится."
    source: "ПП РФ № 127, Правила категорирования, п. 6, абз. 3 (введён ПП РФ от 13.04.2019 № 452)"
  - id: no_category
    text: "Если объект не соответствует ни одному показателю критериев значимости и их значениям — категория не присваивается."
    source: "ПП РФ № 127, Правила категорирования, п. 6, абз. 4 (в ред. ПП РФ от 07.11.2025 № 1762)"
  - id: sector_specifics
    text: "Расчёт значений показателей и присвоение категории осуществляются с учётом отраслевых особенностей категорирования. Отраслевые особенности в базу правил прототипа не входят."
    source: "ПП РФ № 127, Правила категорирования, п. 6(1) (введён ПП РФ от 07.11.2025 № 1762)"
  - id: order
    text: "Устанавливаются 3 категории значимости: самая высокая — первая, самая низкая — третья."
    source: "ПП РФ № 127, Правила категорирования, п. 7"

# Условия применимости показателей (см. пакет исходной редакции). Признак подтверждает
# пользователь, движок проверяет, что показатель не заполнен без подтверждённого условия.
conditions:
  - id: state_org
    text: "Субъект КИИ является государственной корпорацией, государственным унитарным предприятием, государственной компанией, организацией оборонно-промышленного комплекса, стратегическим акционерным обществом, стратегическим предприятием"
    short: "Субъект — госкорпорация, ГУП, госкомпания, организация ОПК, стратегическое АО или предприятие"
    source: "ПП РФ № 127, Перечень показателей, п. 8 (в ред. ПП РФ от 20.12.2022 № 2360)"
  - id: financial_org
    text: "Субъект КИИ является в соответствии с законодательством РФ оператором платформы цифрового рубля, системно значимой кредитной организацией, кредитной организацией, выполняющей функции оператора услуг платёжной инфраструктуры системно и социально значимых платёжных систем, кредитной организацией, значимой на рынке платёжных услуг, оператором услуг платёжной инфраструктуры, оказывающим услуги платёжной инфраструктуры в рамках системно значимых платёжных систем"
    short: "Субъект — оператор платформы цифрового рубля, системно значимая или значимая на рынке платёжных услуг кредитная организация, оператор услуг платёжной инфраструктуры значимых платёжных систем"
    source: "ПП РФ № 127, Перечень показателей, п. 10 (в ред. ПП РФ от 07.11.2025 № 1762)"
  - id: central_counterparty
    text: "Субъект КИИ является центральным контрагентом"
    short: "Субъект — центральный контрагент"
    source: "ПП РФ № 127, Перечень показателей, п. 10(1) (введён ПП РФ от 20.12.2022 № 2360)"
  - id: central_depository
    text: "Субъект КИИ является центральным депозитарием и регистратором финансовых транзакций"
    short: "Субъект — центральный депозитарий"
    source: "ПП РФ № 127, Перечень показателей, п. 10(2) (введён ПП РФ от 20.12.2022 № 2360)"
  - id: pension_fund
    text: "Субъект КИИ является негосударственным пенсионным фондом"
    short: "Субъект — негосударственный пенсионный фонд"
    source: "ПП РФ № 127, Перечень показателей, п. 10(3) (введён ПП РФ от 20.12.2022 № 2360)"
  - id: insurer
    text: "Субъект КИИ является страховой организацией"
    short: "Субъект — страховая организация"
    source: "ПП РФ № 127, Перечень показателей, п. 10(4) (введён ПП РФ от 20.12.2022 № 2360)"
  - id: info_exchange_operator
    text: "Субъект КИИ является оператором услуг информационного обмена (некредитной организацией)"
    short: "Субъект — оператор услуг информационного обмена (некредитная организация)"
    source: "ПП РФ № 127, Перечень показателей, п. 10(5) (введён ПП РФ от 20.12.2022 № 2360)"
  - id: microfinance
    text: "Субъект КИИ является микрофинансовой компанией"
    short: "Субъект — микрофинансовая компания"
    source: "ПП РФ № 127, Перечень показателей, п. 10(6) (введён ПП РФ от 07.11.2025 № 1762)"
  - id: credit_bureau
    text: "Субъект КИИ является бюро кредитных историй"
    short: "Субъект — бюро кредитных историй"
    source: "ПП РФ № 127, Перечень показателей, п. 10(7) (введён ПП РФ от 07.11.2025 № 1762)"
  - id: defense_order
    text: "Субъект КИИ выполняет (обеспечивает) государственный оборонный заказ"
    short: "Субъект выполняет (обеспечивает) государственный оборонный заказ"
    source: "ПП РФ № 127, Перечень показателей, п. 13, 13(1)"
  - id: defense_is
    text: "Объект является информационной системой в области обеспечения обороны страны, безопасности государства и правопорядка (кроме систем технических средств для обеспечения оперативно-разыскных мероприятий)"
    short: "Объект — информационная система в области обороны, безопасности государства и правопорядка"
    source: "ПП РФ № 127, Перечень показателей, п. 14 и сноска <6>"

# Варианты для территориальных показателей 2а и 3а (одинаковы в обоих пунктах Перечня).
territory_options: &territory
  - id: none
    text: "Не соответствует ни одному значению"
    category: null
  - id: mo
    text: "В пределах территории одного муниципального образования (численностью от 2 тыс. человек) или одной внутригородской территории города федерального значения"
    category: 3
  - id: subject
    text: "Выход за пределы территории одного муниципального образования (численностью от 2 тыс. человек) или одной внутригородской территории города федерального значения, но не за пределы территории одного субъекта РФ или территории города федерального значения"
    category: 2
  - id: federal
    text: "Выход за пределы территории одного субъекта РФ или территории города федерального значения"
    category: 1

# Диапазоны для показателей «количество людей, тыс. человек» (2б, 3б, 11б).
people_thousands_values: &people
  3: {min: 2, min_incl: true, max: 1000, max_incl: false, text: "более или равно 2, но менее 1000"}
  2: {min: 1000, min_incl: true, max: 5000, max_incl: false, text: "более или равно 1000, но менее 5000"}
  1: {min: 5000, min_incl: true, text: "более или равно 5000"}

# Ограничение ввода для показателей в тысячах человек (инженерное, НЕ нормативное).
people_input: &people_input
  min: 0
  warn_above: 150000
  warn_text: "Значение больше 150 млн человек. Показатель вводится в ТЫСЯЧАХ человек — проверьте, не введено ли число в человеках."

# Ограничение ввода для показателей в процентах (инженерное, НЕ нормативное).
percent_input: &percent_input
  min: 0
  max: 100
  max_text: "Показатель задан в процентах от величины (дохода, объёма продукции) и не может превышать 100 %."

# Ограничение ввода для показателей во времени, часах (инженерное, НЕ нормативное).
hours_input: &hours_input
  min: 0
  warn_above: 8760
  warn_text: "Значение больше 8760 часов (одного года) — проверьте, что время указано в часах."

indicators:

  # ---------------- I. Социальная значимость ----------------
  - id: "1"
    short: "Ущерб жизни и здоровью людей"  # краткое название для интерфейса (не из НПА)
    section: "I. Социальная значимость"
    title: "Причинение ущерба жизни и здоровью людей"
    type: number
    unit: "человек"
    input:  # инженерное ограничение ввода, НЕ нормативное требование
      min: 0
      integer: true
    source: "ПП РФ № 127, Перечень показателей, п. 1"
    values:
      3: {min: 1, min_incl: true, max: 50, max_incl: true, text: "более или равно 1, но менее или равно 50"}
      2: {min: 50, min_incl: false, max: 500, max_incl: true, text: "более 50, но менее или равно 500"}
      1: {min: 500, min_incl: false, text: "более 500"}

  - id: "2а"
    short: "Жизнеобеспечение населения — территория"  # краткое название для интерфейса (не из НПА)
    section: "I. Социальная значимость"
    title: "Прекращение или нарушение функционирования объектов обеспечения жизнедеятельности населения (водо-, тепло-, газо- и электроснабжение) — территория, на которой возможно нарушение обеспечения жизнедеятельности населения"
    type: choice
    source: "ПП РФ № 127, Перечень показателей, п. 2, подп. «а» (в ред. ПП РФ от 20.12.2022 № 2360)"
    options: *territory

  - id: "2б"
    short: "Жизнеобеспечение населения — число людей"  # краткое название для интерфейса (не из НПА)
    section: "I. Социальная значимость"
    title: "Прекращение или нарушение функционирования объектов обеспечения жизнедеятельности населения — количество людей, условия жизнедеятельности которых могут быть нарушены"
    type: number
    unit: "тыс. человек"
    input: *people_input  # инженерное ограничение ввода, НЕ нормативное требование
    source: "ПП РФ № 127, Перечень показателей, п. 2, подп. «б» (в ред. ПП РФ от 20.12.2022 № 2360)"
    values: *people

  - id: "3а"
    short: "Транспорт — территория"  # краткое название для интерфейса (не из НПА)
    section: "I. Социальная значимость"
    title: "Прекращение или нарушение функционирования объектов транспортной инфраструктуры, организаций, осуществляющих грузовые и пассажирские перевозки, транспортных средств — территория, на которой возможно нарушение транспортного сообщения или предоставления транспортных услуг (пассажирских и грузовых перевозок)"
    type: choice
    source: "ПП РФ № 127, Перечень показателей, п. 3, подп. «а» (в ред. ПП РФ от 07.11.2025 № 1762)"
    options: *territory

  - id: "3б"
    short: "Транспорт — число людей без транспортных услуг"  # краткое название для интерфейса (не из НПА)
    section: "I. Социальная значимость"
    title: "Прекращение или нарушение функционирования объектов транспортной инфраструктуры, организаций, осуществляющих грузовые и пассажирские перевозки, транспортных средств — количество людей, для которых могут быть недоступны транспортные услуги"
    type: number
    unit: "тыс. человек"
    input: *people_input  # инженерное ограничение ввода, НЕ нормативное требование
    source: "ПП РФ № 127, Перечень показателей, п. 3, подп. «б» (в ред. ПП РФ от 07.11.2025 № 1762)"
    values: *people

  - id: "3в"
    short: "Транспорт — типы нарушенных перевозок и грузов"  # краткое название для интерфейса (не из НПА)
    section: "I. Социальная значимость"
    title: "Прекращение или нарушение функционирования объектов транспортной инфраструктуры, организаций, осуществляющих грузовые и пассажирские перевозки, транспортных средств — по типам нарушенных перевозок и грузов"
    type: choice
    source: "ПП РФ № 127, Перечень показателей, п. 3, подп. «в» (в ред. ПП РФ от 07.11.2025 № 1762)"
    options:
      - id: none
        text: "Не соответствует ни одному значению"
        category: null
      - id: multimodal
        text: "Мультимодальные и интермодальные перевозки"
        category: 3
      - id: dangerous_one_region
        text: "Перевозка, погрузка, разгрузка, хранение опасных грузов, на перевозку которых требуется специальное разрешение, и (или) грузов повышенной опасности в пределах территории одного субъекта РФ"
        category: 2
      - id: dangerous_regions
        text: "Перевозка, погрузка, разгрузка, хранение опасных грузов, на перевозку которых требуется специальное разрешение, и (или) грузов повышенной опасности в пределах территорий 2 и более субъектов РФ"
        category: 1

  - id: "3г"
    short: "Транспорт — категория объекта транспортной инфраструктуры"  # краткое название для интерфейса (не из НПА)
    section: "I. Социальная значимость"
    title: "Прекращение или нарушение функционирования объектов транспортной инфраструктуры — по категорированию объектов транспортной инфраструктуры (в соответствии с Федеральным законом «О транспортной безопасности»)"
    type: choice
    source: "ПП РФ № 127, Перечень показателей, п. 3, подп. «г» и сноска <7> (введены ПП РФ от 07.11.2025 № 1762)"
    options:
      - id: none
        text: "Не соответствует ни одному значению (объект транспортной инфраструктуры не категорирован)"
        category: null
      - id: oti_3_4
        text: "Объект транспортной инфраструктуры 3-й или 4-й категории"
        category: 3
      - id: oti_2
        text: "Объект транспортной инфраструктуры 2-й категории"
        category: 2
      - id: oti_1
        text: "Объект транспортной инфраструктуры 1-й категории"
        category: 1

  - id: "4а"
    short: "Сеть связи — число абонентов без услуг связи"  # краткое название для интерфейса (не из НПА)
    section: "I. Социальная значимость"
    title: "Прекращение или нарушение функционирования сети связи — количество абонентов, для которых могут быть недоступны услуги связи"
    type: number
    unit: "тыс. человек"
    input: *people_input  # инженерное ограничение ввода, НЕ нормативное требование
    source: "ПП РФ № 127, Перечень показателей, п. 4, подп. «а» (в ред. ПП РФ от 07.11.2025 № 1762)"
    values:
      3: {min: 3, min_incl: true, max: 1000, max_incl: false, text: "более или равно 3, но менее 1000"}
      2: {min: 1000, min_incl: true, max: 5000, max_incl: false, text: "более или равно 1000, но менее 5000"}
      1: {min: 5000, min_incl: true, text: "более или равно 5000"}

  - id: "4б"
    short: "Сеть связи — органы власти без услуг связи"  # краткое название для интерфейса (не из НПА)
    section: "I. Социальная значимость"
    title: "Прекращение или нарушение функционирования сети связи — по уровню органа государственной власти (количеству органов) или организации, для которых могут быть нарушены или недоступны услуги связи"
    type: choice
    source: "ПП РФ № 127, Перечень показателей, п. 4, подп. «б» (в ред. ПП РФ от 07.11.2025 № 1762)"
    options:
      - id: none
        text: "Не соответствует ни одному значению"
        category: null
      - id: regional
        text: "Орган государственной власти субъекта РФ"
        category: 3
      - id: federal
        text: "Федеральный орган государственной власти, государственная корпорация, Центральный банк РФ, 2 и более органа государственной власти субъекта РФ"
        category: 2
      - id: supreme
        text: "Администрация Президента РФ, Правительство РФ, Федеральное Собрание РФ, Совет Безопасности РФ, Верховный Суд РФ, Конституционный Суд РФ, 2 и более федеральных органа государственной власти"
        category: 1

