# База правил: категорирование объектов КИИ.
#
# Источник: docs/PP-127_red_2022-12-20.docx — постановление Правительства РФ от 08.02.2018 № 127
#   в ред. от 20.12.2022 (ПП РФ № 2360). Текст — КонсультантПлюс, дата сохранения 22.10.2026.
#
# Пакет составлен полуавтоматически: черновик сгенерирован по таблице Перечня из текста
# (engine/source_table.py, draft_package; основа — пакеты 2019-04-13 и 2025-11-07), затем
# проверен экспертом: краткие названия пп. 9, 10, 13б, единица п. 13б, формулировки условий
# state_org и financial_org по тексту этой редакции, пометки «в ред.» в источниках.
# Значения показателей — дословно из текста; их совпадение с текстом проверяется тестом
# (tests/test_source_table.py).
#
# Отличия от редакции 2019 г.: п. 5 разделён на 5а (время) и 5б (доля срока по регламенту);
# п. 8 — добавлены организации ОПК; п. 9 — новые пороги 0,0003/0,0006/0,001 %; п. 10 — новый круг
# субъектов и III категория «менее или равно 70» (без нижней границы); новые пп. 10(1)–10(5);
# п. 13б — время изготовления единицы продукции. Редакции от 24.12.2021 и 19.09.2024 изменили
# только организационные пункты Правил — на правила пакета они не влияют, отдельных пакетов нет.

document:
  kind: categorization
  effective_from: 2022-12-20
  title: Правила категорирования объектов КИИ РФ и перечень показателей критериев значимости
  act: Постановление Правительства РФ от 08.02.2018 № 127
  edition: в ред. от 20.12.2022
  file: docs/PP-127_red_2022-12-20.docx
logic:
- id: highest_category
  text: Объекту присваивается категория значимости с наивысшим значением по перечню показателей.
  source: ПП РФ № 127, Правила категорирования, п. 6, абз. 1
- id: subitems
  text: Для показателя с несколькими значениями (территория, количество людей) оценка производится по каждому значению, категория — по наивысшему.
  source: ПП РФ № 127, Правила категорирования, п. 6, абз. 2
- id: first_category_stop
  text: Если по одному из показателей объект отнесён к первой категории, расчёт по остальным показателям не проводится.
  source: ПП РФ № 127, Правила категорирования, п. 6, абз. 3 (введён ПП РФ от 13.04.2019 № 452)
- id: no_category
  text: Если ни один показатель не применим или объект не соответствует ни одному значению — категория не присваивается.
  source: ПП РФ № 127, Правила категорирования, п. 6, абз. 4
- id: order
  text: 'Устанавливаются 3 категории значимости: самая высокая — первая, самая низкая — третья.'
  source: ПП РФ № 127, Правила категорирования, п. 7
conditions:
- id: state_org
  text: Субъект КИИ является государственной корпорацией, государственным унитарным предприятием, государственной компанией, организацией оборонно-промышленного комплекса, стратегическим акционерным обществом,
    стратегическим предприятием
  short: Субъект — госкорпорация, ГУП, госкомпания, организация ОПК, стратегическое АО или предприятие
  source: ПП РФ № 127, Перечень показателей, п. 8 (в ред. ПП РФ от 20.12.2022 № 2360)
- id: financial_org
  text: Субъект КИИ является в соответствии с законодательством РФ системно значимой кредитной организацией, кредитной организацией, выполняющей функции оператора услуг платёжной инфраструктуры системно
    значимых платёжных систем, кредитной организацией, значимой на рынке платёжных услуг, оператором услуг платёжной инфраструктуры, оказывающим услуги платёжной инфраструктуры в рамках системно значимых
    платёжных систем
  short: Субъект — системно значимая или значимая на рынке платёжных услуг кредитная организация, оператор услуг платёжной инфраструктуры системно значимых платёжных систем
  source: ПП РФ № 127, Перечень показателей, п. 10 (в ред. ПП РФ от 20.12.2022 № 2360)
- id: central_counterparty
  text: Субъект КИИ является центральным контрагентом
  short: Субъект — центральный контрагент
  source: ПП РФ № 127, Перечень показателей, п. 10(1) (введён ПП РФ от 20.12.2022 № 2360)
- id: central_depository
  text: Субъект КИИ является центральным депозитарием и регистратором финансовых транзакций
  short: Субъект — центральный депозитарий
  source: ПП РФ № 127, Перечень показателей, п. 10(2) (введён ПП РФ от 20.12.2022 № 2360)
- id: pension_fund
  text: Субъект КИИ является негосударственным пенсионным фондом
  short: Субъект — негосударственный пенсионный фонд
  source: ПП РФ № 127, Перечень показателей, п. 10(3) (введён ПП РФ от 20.12.2022 № 2360)
- id: insurer
  text: Субъект КИИ является страховой организацией
  short: Субъект — страховая организация
  source: ПП РФ № 127, Перечень показателей, п. 10(4) (введён ПП РФ от 20.12.2022 № 2360)
- id: info_exchange_operator
  text: Субъект КИИ является оператором услуг информационного обмена (некредитной организацией)
  short: Субъект — оператор услуг информационного обмена (некредитная организация)
  source: ПП РФ № 127, Перечень показателей, п. 10(5) (введён ПП РФ от 20.12.2022 № 2360)
- id: defense_order
  text: Субъект КИИ выполняет (обеспечивает) государственный оборонный заказ
  short: Субъект выполняет (обеспечивает) государственный оборонный заказ
  source: ПП РФ № 127, Перечень показателей, п. 13 (в ред. ПП РФ от 20.12.2022 № 2360)
- id: defense_is
  text: Объект является информационной системой в области обеспечения обороны страны, безопасности государства и правопорядка
  short: Объект — информационная система в области обороны, безопасности государства и правопорядка
  source: ПП РФ № 127, Перечень показателей, п. 14
