# База правил: состав мер обеспечения безопасности значимых объектов КИИ
# по категориям значимости.
#
# Источник: docs/Prikaz_FSTEK_Rossii_ot_25_12_2017_N_239_red_ot_28_08_2024.docx —
#   приказ ФСТЭК России от 25.12.2017 № 239 в ред. от 28.08.2024 (изменения: приказы
#   ФСТЭК России от 09.08.2018 № 138, от 26.03.2019 № 60, от 20.02.2020 № 35, от 28.08.2024 № 159),
#   п. 22 и приложение к Требованиям. Текст — КонсультантПлюс, дата сохранения 21.10.2026.
# Выжимка с пояснениями: notes/fstek239_measures.md
#
# Поле categories — категории значимости, для которых мера входит в базовый набор
# (в приложении отмечена знаком «+», см. примечание к приложению и п. 23 Требований).
# Пустой список — мера не входит в базовый набор ни одной категории
# (применяется только при адаптации/дополнении набора).
#
# Раздел directions — направления обеспечения безопасности из п. 22 Требований. По п. 22
# они осуществляются мерами, определяемыми по приложению; поле group — группа мер
# приложения, которая реализует направление (null — в приложении такой группы нет).
# Соответствие направлений и групп проверяет верификатор (engine/verification.py).
#
# Опечатки исходного текста, исправленные при формализации:
#   «0ДТ.2» (цифра 0 вместо буквы О) → ОДТ.2.

document:
  kind: measures             # вид правил: меры с базовыми наборами по категориям
  # Дата, с которой применяется эта редакция пакета. Указана дата акта (редакции);
  # дату вступления в силу нужно уточнить по официальной публикации.
  effective_from: 2024-08-28
  title: "Требования по обеспечению безопасности значимых объектов КИИ РФ"
  act: "Приказ ФСТЭК России от 25.12.2017 № 239"
  edition: "в ред. от 28.08.2024"
  file: "docs/Prikaz_FSTEK_Rossii_ot_25_12_2017_N_239_red_ot_28_08_2024.docx"

