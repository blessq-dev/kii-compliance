# Тестовый набор объектов КИИ с эталонными ответами.
#
# Объекты условные (вымышленные), значения показателей подобраны так, чтобы
# покрыть все категории, граничные значения диапазонов и изменения действующих
# редакций по сравнению с исходными (п. 5а, 9, 14 ПП № 127, наборы мер приказа № 239).
#
# Эталоны рассчитаны вручную по действующим редакциям (на 21.10.2026):
#   ПП РФ № 127 в ред. от 07.11.2025, приказ ФСТЭК России № 239 в ред. от 28.08.2024,
#   187-ФЗ в ред. от 07.04.2025. Эталоны по исходным редакциям — в истории git
#   (коммит 567db51 и ранее).
#
# Поля объекта:
#   sphere             — id сферы из пакета 187-ФЗ (rules/187-fz/)
#   indicators         — {номер показателя ПП № 127: значение}; не указан — неприменим
#   attributes         — подтверждённые условия применимости показателей
#                        (id из раздела conditions пакета ПП № 127, rules/pp-127/)
#   implemented        — какие меры реализованы на объекте (входные данные):
#       base_category  — взят весь базовый набор этой категории (null — ничего)...
#       except         — ...кроме этих мер
#       extra          — плюс меры сверх базового набора
#   expected_category  — ЭТАЛОН: категория, рассчитанная вручную по Перечню ПП № 127
#                        (null — категория не присваивается)
#   expected_missing   — ЭТАЛОН: меры, которые должны попасть в несоответствия
#   reasoning          — ручной расчёт эталона

objects:

  - id: obj01
    name: "Медицинская информационная система городской больницы"
    sphere: healthcare
    indicators: {"1": 30}
    implemented: {base_category: 3, except: [АУД.2, ИНЦ.1, ОДТ.4], extra: [ЗИС.17]}
    expected_category: 3
    expected_missing: [АУД.2, ИНЦ.1, ОДТ.4]
    reasoning: "п. 1: 30 чел. ∈ [1; 50] → III. Мера ЗИС.17 вне базового набора на результат не влияет."

  - id: obj02
    name: "АСУ ТП районной котельной"
    sphere: energy
    indicators: {"2а": subject, "2б": 300}
    implemented: {base_category: 2, except: [СОВ.1, ЗИС.4]}
    expected_category: 2
    expected_missing: [СОВ.1, ЗИС.4]
    reasoning: "п. 2а: выход за пределы МО в пределах субъекта → II; п. 2б: 300 тыс. ∈ [2; 1000) → III. Наивысшая — II."

  - id: obj03
    name: "Автоматизированная банковская система системно значимого банка"
    sphere: finance
    indicators: {"10": 150}
    attributes: {financial_org: true}
    implemented: {base_category: 1, except: [АУД.5, АВЗ.5, ЗИС.31]}
    expected_category: 1
    expected_missing: [АУД.5, АВЗ.5]
    reasoning: "п. 10: 150 млн > 120 → I. ЗИС.31 не реализована, но в действующей редакции приказа № 239 не входит в базовый набор I категории — не несоответствие."

  - id: obj04
    name: "АСУ движением поездов метрополитена"
    sphere: transport
    indicators: {"3а": mo, "3б": 1000}
    implemented: {base_category: 2, except: []}
    expected_category: 2
    expected_missing: []
    reasoning: "Граница: п. 3б: 1000 тыс. — «более или равно 1000» → II; п. 3а: в пределах МО → III. Наивысшая — II. Все меры реализованы."

  - id: obj05
    name: "Информационная система учёта публикаций НИИ"
    sphere: science
    indicators: {}
    implemented: {base_category: null}
    expected_category: null
    expected_missing: []
    reasoning: "Ни один показатель неприменим → категория не присваивается (п. 6 абз. 4 Правил)."

  - id: obj06
    name: "Сеть связи сельского района"
    sphere: telecom
    indicators: {"1": 0, "4а": 2.9}
    implemented: {base_category: null}
    expected_category: null
    expected_missing: []
    reasoning: "Граница: п. 4а: 2,9 тыс. абонентов < 3 → не соответствует; п. 1: 0 < 1 → не соответствует. Категория не присваивается."

  - id: obj07
    name: "MES-система металлургического комбината"
    sphere: metallurgy
    indicators: {"8": 10}
    attributes: {state_org: true}
    implemented: {base_category: 3, except: [ЗНИ.8]}
    expected_category: 3
    expected_missing: [ЗНИ.8]
    reasoning: "Граница: п. 8: 10% — «более или равно 1, но менее или равно 10» → III (не II, т. к. II — «более 10»)."

  - id: obj08
    name: "АСУ ТП химического завода"
    sphere: chemical
    indicators: {"1": 120, "11а": federal, "11б": 200}
    implemented: {base_category: 1, except: [ОПС.1, ДНС.4]}
    expected_category: 1
    expected_missing: [ОПС.1, ДНС.4]
    reasoning: "п. 1: 120 ∈ (50; 500] → II; п. 11а: выход за пределы субъекта → I; п. 11б: 200 тыс. → III. Наивысшая — I."

  - id: obj09
    name: "CRM-система торговой сети"
    sphere: other
    indicators: {"1": 5}
    implemented: {base_category: null}
    expected_category: null
    expected_missing: []
    reasoning: "Сфера не входит в ст. 2 п. 8 187-ФЗ → не субъект КИИ, категорированию не подлежит."

  - id: obj10
    name: "Информационная система оборонного предприятия"
    sphere: defense
    indicators: {"14": 3}
    attributes: {defense_is: true}
    implemented: {base_category: 1, except: []}
    expected_category: 3
    expected_missing: []
    reasoning: "п. 14: 3 ч ∈ (2; 4] → III. (В исходной редакции I категория была «более 1» ч, и по буквальному тексту получалась I.) Реализован набор I категории — несоответствий нет."

  - id: obj11
    name: "Информационная система крупного налогоплательщика"
    sphere: finance
    indicators: {"9": 0.0006}
    implemented: {base_category: 2, except: [ИАФ.0]}
    expected_category: 3
    expected_missing: [ИАФ.0]
    reasoning: "Граница: п. 9: 0,0006% — «более 0,0003, но менее или равно 0,0006» → III (II — «более 0,0006»)."

  - id: obj12
    name: "Региональный портал государственных услуг"
    sphere: telecom
    indicators: {"1": 5, "5а": 6}
    implemented: {base_category: 1, except: [ПЛН.1, ИПО.2]}
    expected_category: 1
    expected_missing: [ПЛН.1, ИПО.2]
    reasoning: "Граница: п. 5а: ровно 6 ч — «менее или равно 6» → I (в исходной редакции значение 6 не попадало ни в один диапазон); п. 1: 5 чел. → III. Наивысшая — I."

  - id: obj13
    name: "Ситуационный центр федеральной госкорпорации"
    sphere: interaction
    indicators: {"6": regional, "12": federal}
    implemented: {base_category: 2, except: [ДНС.3]}
    expected_category: 2
    expected_missing: [ДНС.3]
    reasoning: "п. 12: СЦ госкорпорации → II; п. 6: орган субъекта РФ → III. Наивысшая — II."

  - id: obj14
    name: "Система управления скорой медицинской помощью"
    sphere: healthcare
    indicators: {"1": 51}
    implemented: {base_category: 2, except: []}
    expected_category: 2
    expected_missing: []
    reasoning: "Граница: п. 1: 51 чел. — «более 50» → II."

  - id: obj15
    name: "АСУ ТП магистрального нефтепровода"
    sphere: fuel_energy
    indicators: {"11а": subject, "13а": 15}
    attributes: {defense_order: true}
    implemented: {base_category: 2, except: [ОДТ.1, ОДТ.2]}
    expected_category: 2
    expected_missing: [ОДТ.1, ОДТ.2]
    reasoning: "п. 11а: в пределах субъекта → II; граница п. 13а: 15% — «менее или равно 15» → II."

  - id: obj16
    name: "Клиринговая система центрального контрагента"
    sphere: finance
    indicators: {"10(1)": 0.5}
    attributes: {central_counterparty: true}
    implemented: {base_category: 3, except: [УПД.5]}
    expected_category: 3
    expected_missing: [УПД.5]
    reasoning: "п. 10(1): 0,5 трлн руб. — «менее 1» → III (нижней границы у III категории нет)."

  - id: obj17
    name: "АСУ морского торгового порта"
    sphere: transport
    indicators: {"3в": dangerous_one_region, "3г": oti_1}
    implemented: {base_category: 1, except: []}
    expected_category: 1
    expected_missing: []
    reasoning: "п. 3в: опасные грузы в пределах одного субъекта → II; п. 3г: объект транспортной инфраструктуры 1-й категории → I. Наивысшая — I."

  - id: obj18
    name: "Система ведения ЕГРН в субъекте РФ"
    sphere: real_estate
    indicators: {"6": regional, "5а": 13}
    implemented: {base_category: 3, except: [ЗИС.3]}
    expected_category: 3
    expected_missing: [ЗИС.3]
    reasoning: "Сфера госрегистрации прав на недвижимость (187-ФЗ в ред. 2023–2025). п. 6: орган субъекта РФ → III; п. 5а: 13 ч ∈ (12; 24] → III. Итог — III."
